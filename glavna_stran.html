    <script>
        // Podatki
        var Predmet = [
            { idPredmeta: 1, Ime_predmeta: "Slovenščina" },
            { idPredmeta: 2, Ime_predmeta: "VVO" },
            { idPredmeta: 3, Ime_predmeta: "RPR" },
            { idPredmeta: 4, Ime_predmeta: "Angleščina" },
            { idPredmeta: 5, Ime_predmeta: "SMV" }
        ];

        var Ucitelj = [
            { idUčitelja: 1, Ime: "Valentina", Priimek: "Hrastnik" },
            { idUčitelja: 2, Ime: "Borut", Priimek: "Slemenšek" },
            { idUčitelja: 3, Ime: "Rosana", Priimek: "Breznik" },
            { idUčitelja: 4, Ime: "Jaka", Priimek: "Koren" },
            { idUčitelja: 5, Ime: "Boštjan", Priimek: "Resinovič" },
            { idUčitelja: 6, Ime: "Marija", Priimek: "Črepinšek" }
        ];

        var Ucenec_Predmet = [
            { idUčenca: 6, idPredmeta: 1 },
            { idUčenca: 6, idPredmeta: 2 },
            { idUčenca: 6, idPredmeta: 3 }
        ];

        var Naloga = [
            { idNaloge: 6, Naslov: "Slovenščina - Naloga", Datum_oddaje: "2025-01-15", Ocena: 4, idUčenca: 6, idUčitelja: 6, idPredmeta: 1 }
        ];

        const userId = <?php echo $_SESSION['user_id']; ?>;

        function najdiPredmetPoId(id) {
            for (var i = 0; i < Predmet.length; i++) {
                if (Predmet[i].idPredmeta === id) {
                    return Predmet[i];
                }
            }
            return null;
        }

        function najdiUciteljaPoId(id) {
            for (var i = 0; i < Ucitelj.length; i++) {
                if (Ucitelj[i].idUčitelja === id) {
                    return Ucitelj[i];
                }
            }
            return null;
        }

        function renderTable(containerId, columns, rows) {
            var container = document.getElementById(containerId);
            if (rows.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 2rem;">Ni podatkov.</p>';
                return;
            }

            var table = document.createElement("table");
            var thead = document.createElement("thead");
            var trHead = document.createElement("tr");
            for (var i = 0; i < columns.length; i++) {
                var th = document.createElement("th");
                th.textContent = columns[i].header;
                trHead.appendChild(th);
            }
            thead.appendChild(trHead);
            var tbody = document.createElement("tbody");
            for (var r = 0; r < rows.length; r++) {
                var tr = document.createElement("tr");
                for (var c = 0; c < columns.length; c++) {
                    var td = document.createElement("td");
                    var col = columns[c];
                    if (typeof col.accessor === "function") {
                        td.innerHTML = col.accessor(rows[r]);
                    } else {
                        td.textContent = rows[r][col.accessor] || "";
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            table.appendChild(thead);
            table.appendChild(tbody);
            container.innerHTML = "";
            container.appendChild(table);
        }

        function loadMyGrades() {
            const myGrades = Naloga.filter(g => g.idUčenca === userId);
            
            renderTable(
                "my-grades",
                [
                    { header: "Predmet", accessor: function(row) {
                        var p = najdiPredmetPoId(row.idPredmeta);
                        return p ? p.Ime_predmeta : row.idPredmeta;
                    }},
                    { header: "Naslov", accessor: "Naslov" },
                    { header: "Datum", accessor: "Datum_oddaje" },
                    { header: "Ocena", accessor: function(row) {
                        const grade = row.Ocena;
                        let className = '';
                        if (grade >= 4) className = 'grade-good';
                        else if (grade >= 3) className = 'grade-medium';
                        else className = 'grade-bad';
                        return `<span class="${className}">${grade}</span>`;
                    }},
                    { header: "Učitelj", accessor: function(row) {
                        var u = najdiUciteljaPoId(row.idUčitelja);
                        return u ? u.Ime + ' ' + u.Priimek : row.idUčitelja;
                    }}
                ],
                myGrades
            );
        }

        function loadStatistics() {
            const myGrades = Naloga.filter(g => g.idUčenca === userId);
            const totalGrades = myGrades.length;
            let sum = 0;
            myGrades.forEach(g => sum += g.Ocena);
            const average = totalGrades > 0 ? (sum / totalGrades).toFixed(2) : 0;

            const statsDiv = document.getElementById('statistics');
            statsDiv.innerHTML = `
                <div class="stat-box">
                    <h3>Skupaj ocen</h3>
                    <div class="value">${totalGrades}</div>
                </div>
                <div class="stat-box">
                    <h3>Povprečna ocena</h3>
                    <div class="value">${average}</div>
                </div>
                <div class="stat-box">
                    <h3>Moji predmeti</h3>
                    <div class="value">${Ucenec_Predmet.filter(up => up.idUčenca === userId).length}</div>
                </div>
            `;
        }

        function loadMySubjects() {
            const mySubjects = Ucenec_Predmet.filter(up => up.idUčenca === userId);
            const subjectsData = mySubjects.map(up => {
                const predmet = najdiPredmetPoId(up.idPredmeta);
                return predmet || { idPredmeta: up.idPredmeta, Ime_predmeta: 'Neznan predmet' };
            });

            renderTable(
                "my-subjects",
                [
                    { header: "ID", accessor: "idPredmeta" },
                    { header: "Ime predmeta", accessor: "Ime_predmeta" }
                ],
                subjectsData
            );
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadMyGrades();
            loadStatistics();
            loadMySubjects();
        });
    </script>
